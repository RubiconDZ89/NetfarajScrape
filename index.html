<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamFlix - Votre Plateforme de Streaming</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barre de navigation -->
  <header class="navbar">
    <div class="logo">STREAMFLIX</div>
    <nav>
      <a href="#" class="active">Accueil</a>
      <a href="#">Séries</a>
      <a href="#">Films</a>
    </nav>
  </header>

  <!-- Bannière principale (Hero) -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 id="hero-title">Chargement...</h1>
      <p id="hero-desc">Sélectionnez un contenu dans le catalogue ci-dessous.</p>
      <button id="hero-play-btn" class="btn-play">▶ Regarder</button>
    </div>
  </section>

  <!-- Catalogue de contenus -->
  <main class="catalog-container">
    <h2>En vedette</h2>
    <div class="movie-grid" id="movie-grid">
      <!-- Les cartes seront générées dynamiquement par app.js -->
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
