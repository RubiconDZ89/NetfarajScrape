<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamFlix - Votre Plateforme de Streaming</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barre de navigation -->
  <header class="navbar">
    <div class="logo">STREAMFLIX</div>
    <nav>
      <a href="#" class="active">Accueil</a>
      <a href="#">Séries</a>
      <a href="#">Films</a>
    </nav>
  </header>

  <!-- Bannière principale (Hero) -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 id="hero-title">Chargement...</h1>
      <p id="hero-desc">Sélectionnez un contenu ou importez une liste M3U ci-dessous.</p>
      <button id="hero-play-btn" class="btn-play">▶ Regarder</button>
    </div>
  </section>

  <!-- Zone d'importation M3U -->
  <section class="m3u-input-container">
    <h3>Importer une liste M3U</h3>
    <div class="m3u-form">
      <input type="url" id="m3u-url-input" placeholder="Collez votre lien .m3u ou .m3u8 ici..." required>
      <button id="load-m3u-btn">Charger le catalogue</button>
    </div>
  </section>

  <!-- Catalogue de contenus -->
  <main class="catalog-container">
    <h2>En vedette</h2>
    <div class="movie-grid" id="movie-grid">
      <!-- Les cartes seront générées dynamiquement -->
    </div>
  </main>

  <script>
    // =========================================================================
    // CODE DE L'APPLICATION (INTEGRÉ DIRECTEMENT)
    // =========================================================================

    const DEFAULT_M3U_URL = "https://qimyclient.store/get.php?username=wave6579&password=123456&type=m3u_plus";

    const fallbackCatalog = [
      {
        title: "Sintel (Film d'animation)",
        description: "Un film d'animation open-source produit par la Fondation Blender.",
        poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500",
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      },
      {
        title: "Tears of Steel",
        description: "Court-métrage de science-fiction.",
        poster: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?w=500",
        streamUrl: "https://test-streams.mux.dev/pts_shift/master.m3u8"
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const loadBtn = document.getElementById('load-m3u-btn');
      const urlInput = document.getElementById('m3u-url-input');

      if (urlInput) urlInput.value = DEFAULT_M3U_URL;

      loadM3UPlaylist(DEFAULT_M3U_URL);

      if (loadBtn) {
        loadBtn.addEventListener('click', () => {
          const customUrl = urlInput.value.trim();
          if (customUrl) loadM3UPlaylist(customUrl);
        });
      }
    });

    async function loadM3UPlaylist(m3uUrl) {
      const loadBtn = document.getElementById('load-m3u-btn');
      const heroTitle = document.getElementById('hero-title');

      if (heroTitle) heroTitle.textContent = "Connexion au serveur M3U...";
      if (loadBtn) {
        loadBtn.textContent = "Chargement...";
        loadBtn.disabled = true;
      }

      let m3uText = null;

      // Essai 1 : Proxy Cloudflare local
      try {
        const proxiedM3uUrl = `/api/proxy?url=${encodeURIComponent(m3uUrl)}`;
        const response = await fetch(proxiedM3uUrl);
        if (response.ok) m3uText = await response.text();
      } catch (e) {
        console.warn("Échec proxy Cloudflare local, tentative via proxy externe...", e);
      }

      // Essai 2 : Proxy de secours externe
      if (!m3uText) {
        try {
          const fallbackProxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(m3uUrl)}`;
          const response = await fetch(fallbackProxyUrl);
          if (response.ok) m3uText = await response.text();
        } catch (e) {
          console.error("Échec proxy de secours :", e);
        }
      }

      if (m3uText) {
        try {
          const playlistItems = await parseM3UOptimized(m3uText);
          if (playlistItems.length > 0) {
            renderCatalog(playlistItems);
          } else {
            throw new Error("Aucun élément trouvé.");
          }
        } catch (error) {
          console.error("Erreur M3U :", error);
          renderCatalog(fallbackCatalog);
        }
      } else {
        renderCatalog(fallbackCatalog);
      }

      if (loadBtn) {
        loadBtn.textContent = "Charger le catalogue";
        loadBtn.disabled = false;
      }
    }

    function parseM3UOptimized(m3uData, maxItems = 150) {
      return new Promise((resolve) => {
        const lines = m3uData.split('\n');
        const items = [];
        let currentItem = null;
        let i = 0;

        function processChunk() {
          const chunkSize = 2000;
          const end = Math.min(i + chunkSize, lines.length);

          for (; i < end; i++) {
            let line = lines[i].trim();

            if (line.startsWith('#EXTINF:')) {
              currentItem = {
                title: 'Contenu sans nom',
                poster: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500',
                streamUrl: ''
              };

              const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
              if (logoMatch && logoMatch[1]) currentItem.poster = logoMatch[1];

              const titleParts = line.split(',');
              if (titleParts.length > 1) currentItem.title = titleParts.slice(1).join(',').trim();

            } else if (line.length > 0 && !line.startsWith('#') && currentItem) {
              currentItem.streamUrl = line;
              items.push(currentItem);
              currentItem = null;

              if (items.length >= maxItems) {
                resolve(items);
                return;
              }
            }
          }

          if (i < lines.length && items.length < maxItems) {
            setTimeout(processChunk, 0);
          } else {
            resolve(items);
          }
        }

        processChunk();
      });
    }

    function renderCatalog(items) {
      const grid = document.getElementById('movie-grid');
      const heroTitle = document.getElementById('hero-title');
      const heroDesc = document.getElementById('hero-desc');
      const heroPlayBtn = document.getElementById('hero-play-btn');

      if (!grid) return;
      grid.innerHTML = '';

      if (items.length > 0) {
        const featured = items[0];
        if (heroTitle) heroTitle.textContent = featured.title;
        if (heroDesc) heroDesc.textContent = `Catalogue prêt (${items.length} contenus disponibles).`;
        if (heroPlayBtn) heroPlayBtn.onclick = () => launchPlayer(featured.streamUrl);
      }

      items.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${item.poster}" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500'">
          <div class="card-info">
            <h3>${item.title}</h3>
          </div>
        `;

        card.addEventListener('click', () => launchPlayer(item.streamUrl));
        grid.appendChild(card);
      });
    }

    function launchPlayer(url) {
      window.location.href = `player.html?url=${encodeURIComponent(url)}`;
    }
  </script>
</body>
</html>
